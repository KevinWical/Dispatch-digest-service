name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          # Disposable CI credentials, never used outside this job.
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: dispatch_test_ci
          MYSQL_USER: dispatch_ci
          MYSQL_PASSWORD: ci-only-test-password
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysql --protocol=TCP --host=127.0.0.1 --user=dispatch_ci --password=ci-only-test-password dispatch_test_ci --execute='SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: dispatch_ci
      DB_PASSWORD: ci-only-test-password
      # The integration test overrides DB_NAME with its dedicated database.
      DB_NAME: dispatch_ci
      DISPATCH_TEST_DB_NAME: dispatch_test_ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Dependencies
        run: | 
          npm ci

      - name: Run Tests
        run: |
          npm run validate
